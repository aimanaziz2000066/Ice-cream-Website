<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice-cream Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <!-- Navbar Here -->
    <header class="container">
        <nav class="navbar flex">
            <a href="#" class="logo">
                <i class="fa-solid fa-ice-cream"></i>
                Scooply
            </a>
            <ul class="navlist flex">
                <li>
                    <a href="#" class="link">Shop</a>
                </li>
                <li>
                    <a href="#" class="link">About Us</a>
                </li>
                <li>
                    <a href="#" class="link">Flavours</a>
                </li>
                <li>
                    <a href="#" class="link">Our Story</a>
                </li>
                <li>
                    <a href="#" class="link">Contact</a>
                </li>
            </ul>
            <div class="nav-icons flex">

                <a href="#" class="icon">
                    <i class="fa-solid fa-user"></i>
                </a>

                <a href="#" class="icon">
                    <i class="fa-solid fa-shopping-bag"></i>
                </a>

            </div>

        </nav>
    </header>

    <!-- Sections Here -->
    <main>
        <section class="hero">
            <div class="inner-hero container flex">
                <div class="hero-right-image">
                    <img src="images/strawberry.png">
                </div>
                <h1>Milky Scoops</h1>
                <div class="hero-left-image">
                    <img src="images/strawberry scoop.png">
                </div>
            </div>
            <div class="hero-center-image">
                <img src="images/double delight.png">
            </div>

        </section>
        <section class="sections">
            <div class="container">
                <h2>Browse Your Product</h2>
                <div class="card-container flex">
                    <div class="card">
                        <div class="card-image">
                            <img src="images/pistachio icecream.png">
                        </div>
                        <div class="content flex">
                            <div>
                                <p>Pistachio Ice-cream</p>
                                <span>Rs.150</span>
                            </div>
                            <a href="#" class="icon">
                                <i class="fa-solid fa-shopping-bag"></i>

                            </a>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-image">
                        </div>
                        <div class="content flex">
                            <div>
                                <p>Double-delight Ice-cream</p>
                                <span>Rs.180</span>
                            </div>
                            <a href="#" class="icon">
                                <i class="fa-solid fa-shopping-bag"></i>

                            </a>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-image">
                            <img src="images/strawberry icecream.png">
                        </div>
                        <div class="content flex">
                            <div>
                                <p>Strawberry Ice-cream</p>
                                <span>Rs.120</span>
                            </div>
                            <a href="#" class="icon">
                                <i class="fa-solid fa-shopping-bag"></i>

                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section></section>
        <section></section>
        <section></section>
    </main>

    <!-- Footer Here-->
    <footer>

    </footer>


    <script src="main.js"></script>
</body>

</html>
